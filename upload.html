<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UGANDS | Upload File</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossoriginht@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Inter,sans-serif;
    background:#f8fafc;
    color:#111827;
}

.container{
    max-width:900px;
    margin:auto;
    padding:80px 20px;
}

.logo{
    font-size:40px;
    font-weight:800;
    color:#082567;
    margin-bottom:50px;
}

.card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:20px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,.05);
}

h1{
    margin-bottom:15px;
}

p{
    color:#64748b;
    margin-bottom:30px;
}

.upload-box{
    border:2px dashed #cbd5e1;
    border-radius:16px;
    padding:50px;
    text-align:center;
    background:#f8fafc;
}

input[type=file]{
    margin-top:20px;
}

.file-name{
    margin-top:20px;
    font-weight:600;
    color:#2563eb;
}

.templates{
    margin-top:40px;
}

.template{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:15px;
    margin-top:10px;
    cursor:pointer;
}

.template:hover{
    background:#eff6ff;
    border-color:#2563eb;
}

.template.selected{
    background:#2563eb;
    color:white;
    border-color:#2563eb;
}

.btn{
    display:inline-block;
    margin-top:30px;
    padding:14px 24px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-weight:600;
}

.btn:hover{
    background:#1d4ed8;
}

.layout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
    margin-top:30px;
}

@media(max-width:900px){

    .layout{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<body>

<div class="container">

<div class="logo">
UGANDS
</div>

<div class="card">

<h1>Upload Your File</h1>

<p>
Upload an Excel or CSV file and choose how you want to transform your data.
</p>

<div class="layout">

<div class="upload-box">

<h3>Select a file</h3>

<input type="file" id="fileInput">

<p id="selectedFile"></p>

<div id="output"></div>

<div id="fileName" class="file-name"></div>

</div>

<div class="templates">

<h2>Choose Template</h2>

<div class="template" data-template="attendance">
✅ Attendance Tracker
</div>

<div class="template" data-template="inventory">
📦 Inventory Manager
</div>

<div class="template" data-template="inspection">
📋 Inspection Checklist
</div>

<div class="template" data-template="maintenance">
🛠 Maintenance Register
</div>

<div style="margin-top:30px;">

    <h2>Options</h2>

    <div style="margin-top:20px;">

        <label>
            Application Title
        </label>

        <input
            type="text"
            id="appTitle"
            value="Training Attendance"
            style="
                width:100%;
                padding:12px;
                margin-top:8px;
                border:1px solid #ddd;
                border-radius:10px;
            "
        >

    </div>

    <div style="margin-top:20px;">

        <label>
            <input
                type="checkbox"
                id="showTotal"
                checked
            >
            Show Total Attendees
        </label>

    </div>

    <div style="margin-top:10px;">

        <label>
            <input
                type="checkbox"
                id="showPresent"
                checked
            >
            Show Present Count
        </label>

    </div>

</div>


<button class="btn" id="generateBtn">
Generate Application
</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const fileInput = document.getElementById("fileInput");
const selectedFile = document.getElementById("selectedFile");
const output = document.getElementById("output");

let participants = [];
let selectedTemplate = "attendance";

const supabaseUrl =
"https://jrowpoyottntwmpvqaks.supabase.co";

const supabaseKey =
"sb_publishable_nltzzKx3WVg9i7H90E5duA_sWxne9qN";

const { createClient } = window.supabase;

const db = createClient(
    supabaseUrl,
    supabaseKey
);

console.log(db);
console.log(typeof db.from);

fileInput.addEventListener("change", function(){

    const file = fileInput.files[0];

    if(!file) return;

    selectedFile.innerHTML =
        "✅ Selected file: " + file.name;

    const reader = new FileReader();

    reader.onload = function(e){

        const text = e.target.result;

const rows = text.trim().split("\n");
participants = [];


let html = `
<h3>Attendance List</h3>
<div style="
max-width:500px;
margin:auto;
">
`;

for(let i = 1; i < rows.length; i++){

    const cols = rows[i].split(",");

    const nome = cols[0];
    const presente = cols[1]?.trim().toLowerCase() || "no";
	
	participants.push({
    name: nome,
    present: presente === "yes"
});

    html += `
    <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        background:white;
        padding:15px;
        margin-bottom:10px;
        border-radius:10px;
        border:1px solid #ddd;
    ">

        <strong>${nome}</strong>

        <button
            onclick="
                if(this.innerText==='NO'){
                    this.innerText='YES';
                    this.style.background='#16a34a';
                }else{
                    this.innerText='NO';
                    this.style.background='#dc2626';
                }
            "
            style="
                width:70px;
                border:none;
                border-radius:8px;
                padding:8px;
                color:white;
                cursor:pointer;
                background:${presente === 'yes' ? '#16a34a' : '#dc2626'};
            "
        >
            ${presente.toUpperCase()}
        </button>

    </div>
    `;

}

html += `</div>`;

output.innerHTML = html;

    };

    reader.readAsText(file);

});

document
.getElementById("generateBtn")
.addEventListener("click", async function(){

const appData = {

    title:
        document.getElementById("appTitle").value,

    participants:
        participants,

    showTotal:
        document.getElementById("showTotal").checked,

    showPresent:
        document.getElementById("showPresent").checked

};

console.log("HERE");
const { data, error } = await db
    .from("apps")
    .insert([
        {
            template: selectedTemplate,
            data: appData
        }
    ])
    .select();
	

	
if(error){

    console.log(error);
    alert("Error saving application");

    return;
}

alert("before redirect");

    window.location.href = `attendance.html?id=${data[0].id}`;
	
	alert("after redirect");


});

const templates =
document.querySelectorAll(".template");

templates.forEach(template => {

    template.addEventListener("click", function(){

        templates.forEach(t => {
            t.classList.remove("selected");
        });

        this.classList.add("selected");

        selectedTemplate =
        this.dataset.template;

        console.log(
            "Selected template:",
            selectedTemplate
        );

    });

});

templates[0].classList.add("selected");

async function testInsert(){

    const { data, error } = await db
        .from("apps")
        .insert([
            {
                template: "attendance",
                data: {
                    title: "Teste UGANDS"
                }
            }
        ])
        .select();

    console.log("DATA:", data);
    console.log("ERROR:", error);

}

testInsert();

</script>

</body>
</html>
