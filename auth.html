<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UGANDS | Sign In</title>

<style>

body{
    font-family:Inter,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#ffffff;
}

.card{
    width:450px;
    background:#f3f4f6;
    padding:40px;
    border-radius:20px;
    text-align:center;
}

button{
    width:100%;
    padding:16px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
}

.google{
    background:#2563eb;
    color:white;
}

.microsoft{
    background:#111827;
    color:white;
}

</style>

</head>

<body>

<div class="card">

    <img
        src="logo.png"
        alt="UGANDS"
        style="height:120px;"
    >

    <h1>Sign in to continue</h1>

    <p>
        Create and manage your applications.
    </p>

    <button
        id="googleBtn"
        class="google">
        Continue with Google
    </button>

    <button
        id="microsoftBtn"
        class="microsoft">
        Continue with Microsoft
    </button>

</div>

</body>

</html>
