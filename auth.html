<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UGANDS | Sign In</title>

<style>

body{
    font-family:Inter,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#ffffff;
}

.card{
    width:450px;
    background:#f3f4f6;
    padding:40px;
    border-radius:20px;
    text-align:center;
}

button{
    width:100%;
    padding:16px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
}

.google{
    background:#2563eb;
    color:white;
}

.microsoft{
    background:#111827;
    color:white;
}

.guest{
    background:#6b7280;
    color:white;
}

</style>

</head>

<body>

<div class="card">

    <img
        src="logo.png"
        alt="UGANDS"
        style="height:120px;"
    >

    <h1>Sign in to continue</h1>

    <p>
        Create and manage your applications.
    </p>

    <button
        id="googleBtn"
        class="google">
        Continue with Google
    </button>

    <button
        id="microsoftBtn"
        class="microsoft">
        Continue with Microsoft
    </button>
	
	<button
    id="guestBtn"
    class="guest">
    Continue as Guest
</button>


</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl =
"https://jrowpoyottntwmpvqaks.supabase.co";

const supabaseKey =
"sb_publishable_nltzzKx3WVg9i7H90E5duA_sWxne9qN";

const { createClient } = window.supabase;

const db = createClient(
    supabaseUrl,
    supabaseKey
);

db.auth.onAuthStateChange((event, session) => {

    if (session) {
        window.location.href = "upload.html";
    }

});

db.auth.getSession().then(({ data }) => {


});

async function checkSession() {

    const {
        data: { session }
    } = await db.auth.getSession();


    if (session) {

        window.location.href =
            "upload.html";

    }

}

checkSession();

document
.getElementById("googleBtn")
.addEventListener("click", async () => {

    await db.auth.signInWithOAuth({
        provider: "google",
        options: {
            redirectTo:
                "https://www.ugands.com/upload.html"
        }
    });

});

document
.getElementById("microsoftBtn")
.addEventListener("click", async () => {

    await db.auth.signInWithOAuth({
        provider: "azure",
        options: {
            redirectTo:
                "https://www.ugands.com/auth.html"
        }
    });

});

document
.getElementById("guestBtn")
.addEventListener("click", async () => {

    const { data, error } =
        await db.auth.signInAnonymously();

    console.log(data);
    console.log(error);

    if (error) {
        alert(error.message);
        return;
    }

    window.location.href = "upload.html";

});

</script>

</body>

</html>
