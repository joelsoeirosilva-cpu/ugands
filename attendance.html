<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance Tracker</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    padding:40px;
}

.container{
    max-width:700px;
    margin:auto;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
    margin-bottom:25px;
}

.person{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    border:1px solid #e5e7eb;
    border-radius:10px;
    margin-bottom:10px;
}

.status{
    width:80px;
    border:none;
    border-radius:8px;
    padding:8px;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.no{
    background:#dc2626;
}

.yes{
    background:#16a34a;
}

</style>
</head>
<body>

<div class="container">

    <div class="card">

		<h1 id="pageTitle"></h1>

<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
">

    <div style="
    display:flex;
    align-items:center;
    gap:10px;
    ">

        <strong>Date:</strong>

        <input
            type="date"
            id="attendanceDate"
            style="
                padding:8px;
                border:1px solid #ddd;
                border-radius:8px;
            "
        >

    </div>

    <div id="stats"></div>

</div>

		<input
    type="text"
    id="searchInput"
    placeholder="Find..."
    oninput="filterParticipants()"
    style="
        padding:8px;
        border:1px solid #ddd;
        border-radius:8px;
    "
>

        <div id="attendanceList"></div>
		
		<div style="
margin-top:25px;
text-align:right;
">

<div
    style="
        display:flex;
        justify-content:flex-end;
        gap:10px;
    "
>

    <button
        id="shareBtn"
        style="
            background:#166534;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:10px;
            cursor:pointer;
            font-weight:bold;
        "
    >
        Share Link
    </button>

    <button
        id="pdfBtn"
        style="
            background:#2563eb;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:10px;
            cursor:pointer;
            font-weight:bold;
        "
    >
        Export PDF
    </button>

</div>

</div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

const supabaseUrl =
"https://jrowpoyottntwmpvqaks.supabase.co";

const supabaseKey =
"sb_publishable_nltzzKx3WVg9i7H90E5duA_sWxne9qN";

const db = supabase.createClient(
    supabaseUrl,
    supabaseKey
);

</script>

<script>

async function loadApplication() {

const params = new URLSearchParams(window.location.search);

const appId = params.get("id");
const shareToken = params.get("share");

console.log("App ID:", appId);
console.log("Share Token:", shareToken);

let query = db
    .from("apps")
    .select("*");

if (shareToken) {
    query = query.eq("share_token", shareToken);
} else {
    query = query.eq("id", appId);
}

const { data, error } = await query.single();

if (error) {
    console.log(error);
    alert("Application not found");
    return;
}

window.participants = data.data.participants || [];
const participants = window.participants;

participants.sort((a, b) =>
   a.name.localeCompare(b.name)
   );

const appTitle = data.data.title || "Attendance Tracker";
window.appTitle = appTitle;
window.appData = data.data;
window.currentShareToken = data.share_token;
const showTotal = data.data.showTotal;
const showPresent = data.data.showPresent;
console.log(window.currentShareToken);


const attendanceList =
document.getElementById("attendanceList");

let html = "";

participants.forEach((person, index) => {

    html += `
    <div class="person">

        <strong>${person.name}</strong>

        <button
            class="status ${person.present ? 'yes' : 'no'}"
            onclick="toggleStatus(this, ${index})"
        >
            ${person.present ? 'YES' : 'NO'}
        </button>

    </div>
    `;

});

attendanceList.innerHTML = html;

updateStats();

document.getElementById(
    "pageTitle"
).innerText = appTitle;

const today = new Date();

document.getElementById(
  "attendanceDate"
).value =
  data.data.attendanceDate ||
  new Date().toISOString().split("T")[0];
  
document
  .getElementById("attendanceDate")
  .addEventListener("change", async function() {
    await db
      .from("apps")
      .update({
        data: {
          ...data.data,
          attendanceDate: this.value
        }
      })
      .eq("id", appId);
  });

let presentCount = 0;

participants.forEach(p => {

    if(p.present){
        presentCount++;
    }

});

let statsText = "";

if(showTotal){

    statsText +=
    `Total: ${participants.length}`;

}

if(showPresent){

    if(statsText !== ""){

        statsText += " | ";

    }

    statsText +=
    `Present: ${presentCount}`;

}

document.getElementById(
    "stats"
).innerHTML = statsText;

window.toggleStatus = async function(button, index){

    if(button.innerText === "NO"){

        button.innerText = "YES";
        button.classList.remove("no");
        button.classList.add("yes");
		
		participants[index].present = true;

    } else {

        button.innerText = "NO";
        button.classList.remove("yes");
        button.classList.add("no");
		
		participants[index].present = false;

    }
	
const { data: result, error } = await db
  .from("apps")
  .update({
    data: {
      ...data.data,
      participants: participants
    }
  })
  .eq("share_token", shareToken)
  .select();


updateStats();

}
document
  .getElementById("searchInput")
  .addEventListener("input", function() {

    const searchText =
      this.value.toLowerCase();

    document
      .querySelectorAll(".person")
      .forEach(person => {

        const name =
          person.querySelector("strong")
          .innerText
          .toLowerCase();

        if (name.includes(searchText)) {
          person.style.display = "";
        } else {
          person.style.display = "none";
        }

      });

  });
function updateStats(){

    const buttons =
    document.querySelectorAll(".status");

    let present = 0;

    buttons.forEach(button => {

        if(button.innerText === "YES"){
            present++;
        }

    });

    const total = buttons.length;

    document.getElementById("stats").innerHTML =
        `Total: ${total} | Present: ${present}`;

}

document
.getElementById("pdfBtn")
.addEventListener("click", function(){

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF();

    const participants = window.participants || [];
    const title = window.appTitle || "Attendance Tracker";

    const date =
        document.getElementById("attendanceDate").value;

    const presentCount =
        participants.filter(p => p.present).length;

    doc.setFontSize(20);
    doc.text("UGANDS Attendance Report", 20, 20);

    doc.setFontSize(12);

    doc.text(`Application: ${title}`, 20, 40);
    doc.text(`Date: ${date}`, 20, 50);
    doc.text(`Total: ${participants.length}`, 20, 60);
    doc.text(`Present: ${presentCount}`, 20, 70);

let y = 75;

doc.setFillColor(240, 240, 240);

doc.rect(20, y - 8, 120, 14, "FD");
doc.rect(140, y - 8, 40, 14, "FD");

doc.setFont(undefined, "bold");

doc.text("Participant", 25, y);
doc.text("Status", 150, y);

doc.setFont(undefined, "normal");

y += 12;

participants.forEach(person => {

if (y > 270) {

    doc.addPage();
    y = 20;

doc.setDrawColor(200, 200, 200);

doc.setFillColor(240, 240, 240);

doc.rect(20, y - 8, 120, 14, "FD");
doc.rect(140, y - 8, 40, 14, "FD");

doc.setFont(undefined, "bold");

doc.text("Participant", 25, y);
doc.text("Status", 150, y);

doc.setFont(undefined, "normal");

y += 12;

}

doc.rect(20, y - 6, 120, 10);
doc.rect(140, y - 6, 40, 10);
doc.text(person.name, 25, y);


if(person.present){

    doc.setTextColor(22, 163, 74);

    doc.text("V", 158, y);

} else {

    doc.setTextColor(220, 38, 38);

    doc.text("X", 158, y);

}

doc.setTextColor(0, 0, 0);

    y += 10;

});
const fileName =
    title.replaceAll(" ", "-");

doc.save(`${fileName}.pdf`);

});
}

loadApplication();

document
    .getElementById("shareBtn")
    .addEventListener("click", async () => {

        const link =
            `${window.location.origin}${window.location.pathname}?share=${window.currentShareToken}`;

        await navigator.clipboard.writeText(link);

        alert("Link copiado para a área de transferência!");
    });

</script>

</body>
</html>
