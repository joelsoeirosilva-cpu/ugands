<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance Tracker</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    padding:40px;
}

.container{
    max-width:700px;
    margin:auto;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
    margin-bottom:25px;
}

.person{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    border:1px solid #e5e7eb;
    border-radius:10px;
    margin-bottom:10px;
}

.status{
    width:80px;
    border:none;
    border-radius:8px;
    padding:8px;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.no{
    background:#dc2626;
}

.yes{
    background:#16a34a;
}

</style>
</head>
<body>

<div class="container">

    <div class="card">

		<h1 id="pageTitle"></h1>

<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
">

    <div style="
    display:flex;
    align-items:center;
    gap:10px;
    ">

        <strong>Date:</strong>

        <input
            type="date"
            id="attendanceDate"
            style="
                padding:8px;
                border:1px solid #ddd;
                border-radius:8px;
            "
        >

    </div>

    <div id="stats"></div>

</div>

        <div id="attendanceList"></div>
		
		<div style="
margin-top:25px;
text-align:right;
">

    <button
        id="pdfBtn"
        style="
            background:#2563eb;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:10px;
            cursor:pointer;
            font-weight:bold;
        "
    >
        Export PDF
    </button>

</div>

    </div>

</div>

<script>

const participants =
JSON.parse(
    localStorage.getItem("participants")
) || [];
const appTitle =
localStorage.getItem("appTitle") ||
"Attendance Tracker";

const showTotal =
localStorage.getItem("showTotal") === "true";

const showPresent =
localStorage.getItem("showPresent") === "true";

const attendanceList =
document.getElementById("attendanceList");

let html = "";

participants.forEach(person => {

    html += `
    <div class="person">

        <strong>${person.name}</strong>

        <button
            class="status ${person.present ? 'yes' : 'no'}"
            onclick="toggleStatus(this)"
        >
            ${person.present ? 'YES' : 'NO'}
        </button>

    </div>
    `;

});

attendanceList.innerHTML = html;

updateStats();

document.getElementById(
    "pageTitle"
).innerText = appTitle;

const today = new Date();

document.getElementById(
    "attendanceDate"
).value = today.toISOString().split("T")[0];

let presentCount = 0;

participants.forEach(p => {

    if(p.present){
        presentCount++;
    }

});

let statsText = "";

if(showTotal){

    statsText +=
    `Total: ${participants.length}`;

}

if(showPresent){

    if(statsText !== ""){

        statsText += " | ";

    }

    statsText +=
    `Present: ${presentCount}`;

}

document.getElementById(
    "stats"
).innerHTML = statsText;

function toggleStatus(button){

    if(button.innerText === "NO"){

        button.innerText = "YES";
        button.classList.remove("no");
        button.classList.add("yes");

    } else {

        button.innerText = "NO";
        button.classList.remove("yes");
        button.classList.add("no");

    }
	
	updateStats();

}
function updateStats(){

    const buttons =
    document.querySelectorAll(".status");

    let present = 0;

    buttons.forEach(button => {

        if(button.innerText === "YES"){
            present++;
        }

    });

    const total = buttons.length;

    document.getElementById("stats").innerHTML =
        `Total: ${total} | Present: ${present}`;

}

document
.getElementById("pdfBtn")
.addEventListener("click", function(){

    window.print();

});

</script>

</body>
</html>
