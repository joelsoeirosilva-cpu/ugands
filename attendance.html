<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance Tracker</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    padding:40px;
}

.container{
    max-width:700px;
    margin:auto;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
    margin-bottom:25px;
}

.person{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    border:1px solid #e5e7eb;
    border-radius:10px;
    margin-bottom:10px;
}

.status{
    width:80px;
    border:none;
    border-radius:8px;
    padding:8px;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.no{
    background:#dc2626;
}

.yes{
    background:#16a34a;
}

</style>
</head>
<body>

<div class="container">

    <div class="card">

		<h1 id="pageTitle"></h1>

<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
">

    <div style="
    display:flex;
    align-items:center;
    gap:10px;
    ">

        <strong>Date:</strong>

        <input
            type="date"
            id="attendanceDate"
            style="
                padding:8px;
                border:1px solid #ddd;
                border-radius:8px;
            "
        >

    </div>

    <div id="stats"></div>

</div>

		<input
    type="text"
    id="searchInput"
    placeholder="Find..."
    oninput="filterParticipants()"
    style="
        padding:8px;
        border:1px solid #ddd;
        border-radius:8px;
    "
>

        <div id="attendanceList"></div>
		
		<div style="
margin-top:25px;
text-align:right;
">

<div
    style="
        display:flex;
        justify-content:flex-end;
        gap:10px;
    "
>

    <button
        id="shareBtn"
        style="
            background:#166534;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:10px;
            cursor:pointer;
            font-weight:bold;
        "
    >
        Share Link
    </button>

    <button
        id="pdfBtn"
        style="
            background:#2563eb;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:10px;
            cursor:pointer;
            font-weight:bold;
        "
    >
        Export PDF
    </button>

</div>

</div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

const supabaseUrl =
"https://jrowpoyottntwmpvqaks.supabase.co";

const supabaseKey =
"sb_publishable_nltzzKx3WVg9i7H90E5duA_sWxne9qN";

const db = supabase.createClient(
    supabaseUrl,
    supabaseKey
);

</script>

<script>

async function loadApplication() {

const params = new URLSearchParams(window.location.search);

const appId = params.get("id");
const shareToken = params.get("share");
const shareMode =
    params.get("mode") || "readonly";
	
const isReadOnly =
    shareMode === "readonly";

console.log("App ID:", appId);
console.log("Share Token:", shareToken);

let query = db
    .from("apps")
    .select("*");

if (shareToken) {
    query = query.eq("share_token", shareToken);
} else {
    query = query.eq("id", appId);
}

const { data, error } = await query.single();

if (error) {
    console.log(error);
    alert("Application not found");
    return;
}
if (isReadOnly) {

    document.body.insertAdjacentHTML(
        "afterbegin",
        `
        <div style="
            background:#f59e0b;
            color:white;
            padding:12px;
            text-align:center;
            font-weight:bold;
        ">
            🔒 READ ONLY MODE
        </div>
        `
    );

}
const logoImg = new Image();
logoImg.src = "logo.png";
window.participants = data.data.participants || [];
const participants = window.participants;

participants.sort((a, b) =>
   a.name.localeCompare(b.name)
   );

const appTitle = data.data.title || "Attendance Tracker";
window.appTitle = appTitle;
window.appData = data.data;
window.currentShareToken = data.share_token;
const showTotal = data.data.showTotal;
const showPresent = data.data.showPresent;
console.log(window.currentShareToken);


const attendanceList =
document.getElementById("attendanceList");

let html = "";

participants.forEach((person, index) => {

    html += `
    <div class="person">

        <strong>${person.name}</strong>

        <button
            class="status ${person.present ? 'yes' : 'no'}"
            onclick="toggleStatus(this, ${index})"
        >
            ${person.present ? 'YES' : 'NO'}
        </button>

    </div>
    `;

});

attendanceList.innerHTML = html;

updateStats();

document.getElementById(
    "pageTitle"
).innerText = appTitle;

if (isReadOnly) {

    document.getElementById(
        "shareBtn"
    ).style.display = "none";

}

const today = new Date();

document.getElementById(
  "attendanceDate"
).value =
  data.data.attendanceDate ||
  new Date().toISOString().split("T")[0];
  
if (isReadOnly) {

    document.getElementById(
        "attendanceDate"
    ).disabled = true;

}
  
document
  .getElementById("attendanceDate")
  .addEventListener("change", async function() {
    await db
      .from("apps")
      .update({
        data: {
          ...data.data,
          attendanceDate: this.value
        }
      })
      .eq("id", appId);
  });

let presentCount = 0;

participants.forEach(p => {

    if(p.present){
        presentCount++;
    }

});

let statsText = "";

if(showTotal){

    statsText +=
    `Total: ${participants.length}`;

}

if(showPresent){

    if(statsText !== ""){

        statsText += " | ";

    }

    statsText +=
    `Present: ${presentCount}`;

}

document.getElementById(
    "stats"
).innerHTML = statsText;

window.toggleStatus = async function(button, index){

    if (isReadOnly) {
        return;
    }

    if(button.innerText === "NO"){

        button.innerText = "YES";
        button.classList.remove("no");
        button.classList.add("yes");
		
		participants[index].present = true;

    } else {

        button.innerText = "NO";
        button.classList.remove("yes");
        button.classList.add("no");
		
		participants[index].present = false;

    }
	
const { data: result, error } = await db
  .from("apps")
  .update({
    data: {
      ...data.data,
      participants: participants
    }
  })
  .eq("share_token", shareToken)
  .select();


updateStats();

}
document
  .getElementById("searchInput")
  .addEventListener("input", function() {

    const searchText =
      this.value.toLowerCase();

    document
      .querySelectorAll(".person")
      .forEach(person => {

        const name =
          person.querySelector("strong")
          .innerText
          .toLowerCase();

        if (name.includes(searchText)) {
          person.style.display = "";
        } else {
          person.style.display = "none";
        }

      });

  });
function updateStats(){

    const buttons =
    document.querySelectorAll(".status");

    let present = 0;

    buttons.forEach(button => {

        if(button.innerText === "YES"){
            present++;
        }

    });

    const total = buttons.length;

    document.getElementById("stats").innerHTML =
        `Total: ${total} | Present: ${present}`;

}

document
.getElementById("pdfBtn")
.addEventListener("click", function(){

document.getElementById(
    "pdfStatus"
).style.display = "flex";

setTimeout(() => {

    const { jsPDF } = window.jspdf;
	
	function drawTableHeader(y) {

    doc.setDrawColor(200, 200, 200);

    doc.setFillColor(240, 240, 240);

    doc.rect(20, y - 8, 120, 14, "FD");
    doc.rect(140, y - 8, 40, 14, "FD");

    doc.setFont(undefined, "bold");

    doc.text("Participant", 25, y);
    doc.text("Status", 150, y);

    doc.setFont(undefined, "normal");

}

    const doc = new jsPDF();

    const participants = window.participants || [];
    const title = window.appTitle || "List Tracker";
	const showTotal = window.appData.showTotal;
	const showPresent = window.appData.showPresent;

    const date =
        document.getElementById("attendanceDate").value;

    const presentCount =
        participants.filter(p => p.present).length;

doc.addImage(
    logoImg,
    "PNG",
    45,
    10,
    120,
    38
);

    doc.setFontSize(12);

doc.setFont(undefined, "bold");
doc.setFontSize(18);
doc.setTextColor(37, 99, 235);

doc.text(title, 20, 70);

doc.setTextColor(0, 0, 0);

doc.setFont(undefined, "normal");
doc.setFontSize(12);
doc.setFont(undefined, "bold");
doc.text("Date:", 145, 70);

doc.setFont(undefined, "normal");
doc.setTextColor(37, 99, 235);

doc.text(date, 160, 70);

doc.setTextColor(0, 0, 0);

let y = 90;

drawTableHeader(y);

y += 12;

participants.forEach(person => {

const checkImg = new Image();
checkImg.src = "check.png";

const crossImg = new Image();
crossImg.src = "cross.png";

if (y > 270) {

    doc.addPage();
    y = 20;
	drawTableHeader(y);
	y +=12;

}
doc.setDrawColor(0, 0, 0);
doc.rect(20, y - 6, 120, 10);
doc.rect(140, y - 6, 40, 10);

doc.text(person.name, 25, y);


if(person.present){

doc.addImage(
    checkImg,
    "PNG",
    153,
    y - 5,
    8,
    8
);


doc.setDrawColor(0, 0, 0);

} else {

doc.addImage(
    crossImg,
    "PNG",
    153,
    y - 5,
    8,
    8
);
``


doc.setDrawColor(0, 0, 0);
}

doc.setTextColor(0, 0, 0);

    y += 10;	

});

y += 5;

if (y > 245) {
    doc.addPage();
}

if(showTotal){

doc.setFont(undefined, "bold");
doc.text("Total:", 130, 265);

doc.setFont(undefined, "normal");
doc.setTextColor(37, 99, 235);
doc.text(`${participants.length}`, 160, 265);

doc.setTextColor(0, 0, 0);
}

if(showPresent) {

doc.setFont(undefined, "bold");
doc.text("Check:", 130, 273);

doc.setFont(undefined, "normal");
doc.setTextColor(37, 99, 235);
doc.text(`${presentCount}`, 160, 273);

doc.setTextColor(0, 0, 0);
}
doc.setFont(undefined, "normal");

doc.setFont(undefined, "normal");
const fileName =
    title.replaceAll(" ", "-");
	
doc.setDrawColor(220,220,220);

doc.line(
    60,
    284,
    150,
    284
);

doc.setFontSize(9);
doc.setTextColor(120,120,120);

doc.text(
    "Generated with UGANDS.com",
    105,
    280,
    { align: "center" }
);

doc.setTextColor(0,0,0);
doc.setFontSize(12);

doc.save(`${fileName}.pdf`);

document.getElementById(
    "pdfStatus"
).style.display = "none";

}, 100);


});
}

loadApplication();

document
.getElementById("shareBtn")
.addEventListener("click", async () => {

    const { data } =
        await db.auth.getSession();

    if (!data.session) {
        alert("Login required");
        return;
    }

    const userId =
        data.session.user.id;

    const { data: profile } = await db
        .from("profiles")
        .select("plan")
        .eq("id", userId)
        .single();

    let mode = "readonly";

    if (profile?.plan === "pro") {

        const editable =
            confirm(
                "OK = Editable Link\n\nCancel = Read Only Link"
            );

        mode =
            editable
            ? "editable"
            : "readonly";
    }

    const link =
        `${window.location.origin}${window.location.pathname}?share=${window.currentShareToken}&mode=${mode}`;

    await navigator.clipboard.writeText(link);

    alert(
        `Link (${mode}) copiado para a área de transferência!`
    );

});

</script>
<div
    id="pdfStatus"
    style="
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(255,255,255,0.85);
        z-index:9999;
        justify-content:center;
        align-items:center;
        font-size:28px;
        font-weight:bold;
        color:#2563eb;
    "
>
    Generating PDF...
</div>
</body>
