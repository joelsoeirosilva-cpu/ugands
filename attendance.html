<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl =
"https://jrowpoyottntwmpvqaks.supabase.co";

const supabaseKey =
"sb_publishable_nltzzKx3WVg9i7H90E5duA_sWxne9qN";

const db = supabase.createClient(
    supabaseUrl,
    supabaseKey
);

const shareModal =
document.getElementById("shareModal");

const editableShareBtn =
document.getElementById("editableShareBtn");

const readonlyShareBtn =
document.getElementById("readonlyShareBtn");

const pdfModal =
document.getElementById("pdfModal");

const brandedPdfBtn =
document.getElementById("brandedPdfBtn");

const professionalPdfBtn =
document.getElementById("professionalPdfBtn");
let pdfMode = null;

</script>

<script>

function renderPriceList(data) {

const items = data.data.items || [];
window.priceItems = items;
const currency =
    data.data.currency || "€";

    document.getElementById("pageTitle").innerText =
        data.data.title || "Price List";
let html="";

items.forEach((item, index) => {

    html += `
    <div class="person">

        <strong>${item.product}</strong>

        <div
            style="
                display:flex;
                align-items:center;
                gap:8px;
            "
        >

            <input
                type="number"
                value="${item.price}"
                placeholder="0.00"
                onchange="updatePrice(${index}, this.value)"
                style="
                    width:120px;
                    padding:8px;
                    border:1px solid #ddd;
                    border-radius:8px;
                "
            >

            <strong>${currency}</strong>

        </div>

    </div>
    `;

});
	console.log(html);
document.getElementById("attendanceList").innerHTML =
    html;

	console.log(
    document.getElementById("attendanceList")
);
	
}

window.updatePrice = async function(index, value){

window.priceItems[index].price = value;

await db
.from("apps")
.update({
data:{
...window.currentAppData.data,
items: window.priceItems
}
})
.eq(
"share_token",
window.currentShareToken
);
};

async function loadApplication() {

const params = new URLSearchParams(window.location.search);

const appId = params.get("id");
const shareToken = params.get("share");
const shareMode =
    params.get("mode") || "readonly";

const isReadOnly =
    shareMode === "readonly";

let query = db
    .from("apps")
    .select("*");

if (shareToken) {
    query = query.eq("share_token", shareToken);
} else {
    query = query.eq("id", appId);
}

const { data, error } = await query.single();

if (error) {
    console.log(error);
    alert("Application not found");
    return;
}

const template = data.template || "Attendance";
window.currentTemplate = template;
window.currentShareToken = data.share_token;
window.currentAppData = data;

switch (template) {

    case "attendance":
        break;

    case "pricelist":
		window.appTitle = data.data.title;
		window.appData = data.data;
        renderPriceList(data);
        break;

}

if (isReadOnly) {

    document.body.insertAdjacentHTML(
        "afterbegin",
        `
        <div style="
            background:#f59e0b;
            color:white;
            padding:12px;
            text-align:center;
            font-weight:bold;
        ">
            🔒 READ ONLY MODE
        </div>
        `
    );

}
const logoImg = new Image();
logoImg.src = "logo.png";

let participants = [];

if(template === "attendance"){

    participants =
        data.data.participants || [];

    participants.sort((a, b) =>
        a.name.localeCompare(b.name)
    );

    window.participants = participants;

}

const appTitle = data.data.title || "Attendance Tracker";
window.appTitle = appTitle;
window.appData = data.data;
window.currentShareToken = data.share_token;
window.currentAppData = data;
const showTotal = data.data.showTotal;
const showPresent = data.data.showPresent;
const showDate = data.data.showDate;

const attendanceList =
document.getElementById("attendanceList");

let html = "";

if (template === "attendance"){
participants.forEach((person, index) => {

    html += `
    <div class="person">

        <strong>${person.name}</strong>

        <button
            class="status ${person.present ? 'yes' : 'no'}"
            onclick="toggleStatus(this, ${index})"
        >
            ${person.present ? 'YES' : 'NO'}
        </button>

    </div>
    `;

});
console.log("ATTENDANCE HTML");
attendanceList.innerHTML = html;

updateStats();
}
document.getElementById(
    "pageTitle"
).innerText = appTitle;

if (isReadOnly) {

    document.getElementById(
        "shareBtn"
    ).style.display = "none";

}

const today = new Date();

document.getElementById(
  "attendanceDate"
).value =
  data.data.attendanceDate ||
  new Date().toISOString().split("T")[0];
  
if(!showDate){

    document.getElementById(
        "dateSection"
    ).style.display = "none";

}


if (isReadOnly) {

    document.getElementById(
        "attendanceDate"
    ).disabled = true;

}

document
  .getElementById("attendanceDate")
  .addEventListener("change", async function() {
    await db
      .from("apps")
      .update({
        data: {
          ...data.data,
          attendanceDate: this.value
        }
      })
      .eq("id", appId);
  });

let presentCount = 0;

if(template === "attendance"){

    participants.forEach(p => {

        if(p.present){
            presentCount++;
        }

    });

}

let statsText = "";

if(showTotal){

    statsText +=
    `Total: ${participants.length}`;

}

if(showPresent){

    if(statsText !== ""){

        statsText += " | ";

    }

    statsText +=
    `Present: ${presentCount}`;

}

document.getElementById(
    "stats"
).innerHTML = statsText;

window.toggleStatus = async function(button, index){

    if (isReadOnly) {
        return;
    }

    if(button.innerText === "NO"){

        button.innerText = "YES";
        button.classList.remove("no");
        button.classList.add("yes");

		participants[index].present = true;

    } else {

        button.innerText = "NO";
        button.classList.remove("yes");
        button.classList.add("no");

		participants[index].present = false;

    }

const { data: result, error } = await db
  .from("apps")
  .update({
    data: {
      ...data.data,
      participants: participants
    }
  })
  .eq("share_token", shareToken)
  .select();


updateStats();

}
document
  .getElementById("searchInput")
  .addEventListener("input", function() {

    const searchText =
      this.value.toLowerCase();

    document
      .querySelectorAll(".person")
      .forEach(person => {

        const name =
          person.querySelector("strong")
          .innerText
          .toLowerCase();

        if (name.includes(searchText)) {
          person.style.display = "";
        } else {
          person.style.display = "none";
        }

      });

  });
function updateStats(){

    const buttons =
    document.querySelectorAll(".status");

    let present = 0;

    buttons.forEach(button => {

        if(button.innerText === "YES"){
            present++;
        }

    });

    const total = buttons.length;

    let statsText = "";

    if(window.appData.showTotal){

        statsText += `Total: ${total}`;

    }

    if(window.appData.showPresent){

        if(statsText !== ""){
            statsText += " | ";
        }

        statsText += `Present: ${present}`;

    }

    document.getElementById("stats").innerHTML =
        statsText;

}

document
.getElementById("pdfBtn")
.addEventListener("click", async function(){

const { data } =
    await db.auth.getSession();

const userId =
    data.session.user.id;

const { data: profile } = await db
    .from("profiles")
    .select("plan")
    .eq("id", userId)
    .single();

if (
    profile?.plan === "pro" &&
    pdfMode !== "professional" &&
    pdfMode !== "branded"
) {

    pdfModal.style.display = "flex";

    return;
}

document.getElementById(
    "pdfStatus"
).style.display = "flex";

setTimeout(() => {

    const { jsPDF } = window.jspdf;

	function drawTableHeader(y) {

    doc.setDrawColor(200, 200, 200);

    doc.setFillColor(240, 240, 240);

    doc.rect(20, y - 8, 120, 14, "FD");
    doc.rect(140, y - 8, 40, 14, "FD");

    doc.setFont(undefined, "bold");

doc.text(
    pdfData.header1,
    25,
    y
);

doc.text(
    pdfData.header2,
    150,
    y
);
    doc.setFont(undefined, "normal");

}

    const doc = new jsPDF();

    const participants = window.participants || [];
	const template =
    window.currentAppData.template;

const items =
    window.priceItems || [];
	const currency =
    window.appData.currency || "€";
	let pdfData;
	
	if(template === "attendance"){

    pdfData = {

        header1: "List",
        header2: "Status",

        rows: participants.map(person => ({
            col1: person.name,
            col2: person.present ? "YES" : "NO"
        }))

    };

}

else if(template === "pricelist"){

    pdfData = {

        header1: "Product",
        header2: "Price",

rows: items.map(item => ({
    col1: item.product,
    col2: `${item.price || ""} ${currency}`
}))

    };

}
    const title = window.appTitle || "List Tracker";
const showTotal =
    template === "attendance"
        ? window.appData.showTotal
        : false;

const showPresent =
    template === "attendance"
        ? window.appData.showPresent
        : false;
		
const showDate =
    window.appData.showDate;
		

const date =
    template === "attendance"
        ? document.getElementById("attendanceDate").value
        : "";

    const presentCount =
        participants.filter(p => p.present).length;

if(pdfMode === "branded"){

    doc.addImage(
        logoImg,
        "PNG",
        45,
        10,
        120,
        38
    );

}

    doc.setFontSize(12);

const startY =
    pdfMode === "professional"
        ? 25
        : 70;

doc.setFont(undefined, "bold");
doc.setFontSize(18);
doc.setTextColor(37, 99, 235);

doc.text(title, 20, startY);

doc.setTextColor(0, 0, 0);

doc.setFont(undefined, "normal");
doc.setFontSize(12);
doc.setFont(undefined, "bold");
if(date){

    doc.setFont(undefined, "bold");
    doc.text("Date:", 145, startY);

    doc.setFont(undefined, "normal");
    doc.setTextColor(37, 99, 235);

    doc.text(date, 160, startY);

    doc.setTextColor(0, 0, 0);

}

doc.setTextColor(0, 0, 0);

let y =
    pdfMode === "professional"
        ? 45
        : 90;

drawTableHeader(y);

y += 12;


pdfData.rows.forEach(row => {

    if (y > 270) {

        doc.addPage();
        y = 20;

        drawTableHeader(y);

        y += 12;

    }

    doc.setDrawColor(0, 0, 0);

    doc.rect(20, y - 6, 120, 10);
    doc.rect(140, y - 6, 40, 10);

    doc.text(
        String(row.col1),
        25,
        y
    );

    doc.text(
        String(row.col2),
        150,
        y
    );

    y += 10;

});

y += 5;

if (y > 245) {
    doc.addPage();
}

if(showTotal){

doc.setFont(undefined, "bold");
doc.text("Total:", 130, 265);

doc.setFont(undefined, "normal");
doc.setTextColor(37, 99, 235);
doc.text(`${participants.length}`, 160, 265);

doc.setTextColor(0, 0, 0);
}

if(showPresent) {

doc.setFont(undefined, "bold");
doc.text("Check:", 130, 273);

doc.setFont(undefined, "normal");
doc.setTextColor(37, 99, 235);
doc.text(`${presentCount}`, 160, 273);

doc.setTextColor(0, 0, 0);
}
doc.setFont(undefined, "normal");

doc.setFont(undefined, "normal");
const fileName =
    title.replaceAll(" ", "-");

doc.setDrawColor(220,220,220);

if(pdfMode === "branded"){

    doc.line(
        60,
        284,
        150,
        284
    );

    doc.setFontSize(9);
    doc.setTextColor(120,120,120);

    doc.text(
        "Generated with UGANDS.com",
        105,
        280,
        { align: "center" }
    );

}

doc.setTextColor(0,0,0);
doc.setFontSize(12);

doc.save(`${fileName}.pdf`);

document.getElementById(
    "pdfStatus"
).style.display = "none";

}, 100);


});
}

loadApplication();

editableShareBtn.addEventListener(
    "click",
    async () => {

        const link =
            `${window.location.origin}${window.location.pathname}?share=${window.currentShareToken}&mode=editable`;

        await navigator.clipboard.writeText(link);

        shareModal.style.display = "none";

        alert("Editable link copied!");

    }
);
brandedPdfBtn.addEventListener(
    "click",
    () => {

        pdfModal.style.display = "none";

        pdfMode = "branded";

document.getElementById("pdfBtn").click();

    }
);
professionalPdfBtn.addEventListener(
    "click",
    () => {

        pdfModal.style.display = "none";

        pdfMode = "professional";

        document.getElementById("pdfBtn").click();

    }
);

readonlyShareBtn.addEventListener(
    "click",
    async () => {

        const link =
            `${window.location.origin}${window.location.pathname}?share=${window.currentShareToken}&mode=readonly`;

        await navigator.clipboard.writeText(link);

        shareModal.style.display = "none";

        alert("Read Only link copied!");

    }
);


document
.getElementById("shareBtn")
.addEventListener("click", async () => {

    const { data } =
        await db.auth.getSession();

    if (!data.session) {
        alert("Login required");
        return;
    }

    const userId =
        data.session.user.id;

    const { data: profile } = await db
        .from("profiles")
        .select("plan")
        .eq("id", userId)
        .single();

    let mode = "readonly";

if (profile?.plan === "pro") {

    shareModal.style.display = "flex";

    return;
}


    const link =
        `${window.location.origin}${window.location.pathname}?share=${window.currentShareToken}&mode=${mode}`;

    await navigator.clipboard.writeText(link);

    alert(
        `Link (${mode}) copiado para a área de transferência!`
    );

});

</script>
<div
    id="pdfStatus"
    style="
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(255,255,255,0.85);
        z-index:9999;
        justify-content:center;
        align-items:center;
        font-size:28px;
        font-weight:bold;\
        color:#2563eb;
    "
>

</div>
